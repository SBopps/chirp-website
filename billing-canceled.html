<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout canceled — Chirp</title>
  <meta name="description" content="You canceled the Chirp subscription checkout. You can try again any time.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="DigitalAssets/ChirpAppCon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .billing-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }
    .billing-card {
      max-width: 480px;
      width: 100%;
      background: rgba(28, 55, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 40px 32px;
      text-align: center;
    }
    .billing-card h1 {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFFBF5;
      margin-bottom: 10px;
    }
    .billing-card p {
      color: rgba(255, 251, 245, 0.78);
      font-size: 1rem;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .billing-card a {
      color: #E8873D;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="billing-wrap">
    <div class="billing-card">
      <h1>Checkout canceled</h1>
      <p>No charges were made. You can finish subscribing any time from inside the Chirp app.</p>
      <p>Need help? <a href="mailto:hello@chirp.camp">hello@chirp.camp</a></p>
    </div>
  </main>
</body>
</html>
